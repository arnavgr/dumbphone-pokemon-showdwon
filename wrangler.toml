name = "cloudphone-pokemon-showdown"
main = "src/index.js"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# One Durable Object instance per browser session (per cookie).
# It holds the live WebSocket connection to Pokemon Showdown's real
# server so the CloudPhone browser never has to speak WebSocket itself.
[[durable_objects.bindings]]
name = "BATTLE_SESSION"
class_name = "BattleSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BattleSession"]
